<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/reactmind/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactMind</title>
    <style>html,body,#root{background:#eef4fb;min-height:100%;margin:0}html[data-theme=dark],html[data-theme=dark] body,#root:where(html[data-theme=dark] *){background:#0f1724}</style>
    <script>
      try {
        var raw = localStorage.getItem('reactmind.settings')
        if (raw) {
          var parsed = JSON.parse(raw)
          if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light')) {
            document.documentElement.dataset.theme = parsed.theme
          }
        }
      } catch {
        /* localStorage indisponível ou JSON inválido — mantém tema padrão */
      }
    </script>
    <script type="module" crossorigin src="/reactmind/assets/index-DDUj4HCG.js"></script>
    <link rel="stylesheet" crossorigin href="/reactmind/assets/index-OuLrTt-0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
