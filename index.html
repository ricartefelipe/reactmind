<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactMind</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#eef4fb}
      html[data-theme='dark'],html[data-theme='dark'] body,#root:where(html[data-theme='dark'] *){background:#0f1724}
    </style>
    <script>
      try {
        var raw = localStorage.getItem('reactmind.settings')
        if (raw) {
          var parsed = JSON.parse(raw)
          if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light')) {
            document.documentElement.dataset.theme = parsed.theme
          }
        }
      } catch {
        /* localStorage indisponível ou JSON inválido — mantém tema padrão */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
